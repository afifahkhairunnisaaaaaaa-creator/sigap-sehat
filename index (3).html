<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGAP CONNECT</title>
<script async src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f7fb;--card:#fff;--tx:#0f2a43;--mut:#587086;--pr:#0b4ea2;--prt:#fff;--soft:#e2f0f8;--ln:#d3e4ee;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a28;--card:#10283b;--tx:#e8f2fa;--mut:#9ab3c6;--pr:#4da3ff;--prt:#04213f;--soft:#163a55;--ln:#24506d;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0a1a28;--card:#10283b;--tx:#e8f2fa;--mut:#9ab3c6;--pr:#4da3ff;--prt:#04213f;--soft:#163a55;--ln:#24506d;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(100deg,#0b4ea2,#0a8f9c 75%,#10b5a3);color:#fff;box-shadow:0 2px 12px -4px rgba(11,78,162,.6)}
header a{color:#fff;text-decoration:none}
.logo{font-size:20px;font-weight:700;display:flex;align-items:center}
.lg{height:48px;width:48px;display:block;border-radius:50%;background:#fff}
.ib{position:relative;font-size:24px;margin-left:14px}
.ib i{position:absolute;top:-6px;right:-8px;background:#e11d48;color:#fff;font-size:12px;border-radius:9px;padding:0 6px;font-style:normal}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;font-weight:800;line-height:1.2;margin:8px 0}h2{font-size:21px;margin:20px 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{background:var(--card);border:2px solid var(--ln);border-radius:22px;padding:18px 8px;text-align:center;text-decoration:none;color:var(--tx);font-weight:700;font-size:17px;line-height:1.25;min-height:156px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;box-shadow:0 6px 16px -10px rgba(15,42,67,.35)}
.mc span{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;font-size:36px;background:var(--cs,#e2f0f8)}
.hero{background:linear-gradient(135deg,#0b4ea2 10%,#0a8f9c 70%,#10b5a3);color:#fff;border-radius:26px;padding:20px 20px 18px;margin:4px 0 18px;box-shadow:0 12px 24px -14px rgba(11,78,162,.8)}
.hero h1{color:#fff;margin:2px 0 10px}.hero .idc{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:2px 14px;font-weight:800;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,42,67,.06);margin:10px 0;display:block;color:var(--tx);text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;margin:10px 0;border:0;border-radius:18px;background:var(--pr);color:var(--prt);box-shadow:0 8px 16px -10px var(--pr);font:700 19px inherit;font-family:inherit;text-decoration:none;cursor:pointer;padding:8px 14px}
.btn.g{background:var(--soft);color:var(--tx);box-shadow:none}
.btn.s{min-height:46px;font-size:16px;width:auto;display:inline-flex;margin:4px 4px 4px 0}
input,select,textarea{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);min-height:52px}
label.f{display:block;margin:12px 0 4px;font-weight:600}
.warn{color:var(--warn);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ln);border-radius:30px;padding:10px 16px;cursor:pointer;background:var(--card)}
.chip input{display:none}
.chip:has(input:checked),.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.bd{display:inline-block;padding:2px 10px;border-radius:20px;font-size:14px;font-weight:600}
.s0{background:#e0f2fe;color:#075985}.s1{background:#fef3c7;color:#92400e}.s2{background:#dcfce7;color:#166534}
.tg{font-size:12px;background:#fde68a;color:#78350f;border-radius:6px;padding:1px 6px;font-weight:700}
.note{background:var(--soft);border-left:5px solid var(--pr);border-radius:12px;padding:10px 14px;font-size:15px;margin:10px 0}
.bar{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.bar div{background:var(--soft);border-radius:8px;height:18px}.bar i{display:block;height:100%;background:var(--pr);border-radius:8px}
.ch{width:100%;height:auto;color:var(--tx)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st b{font-size:30px;display:block;color:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{text-align:center;text-decoration:none;color:var(--mut);font-size:12px;font-weight:700;padding:8px 0}nav a.on{color:var(--pr);font-weight:800}nav a span{display:block;font-size:24px;width:58px;margin:0 auto 2px;padding:2px 0;border-radius:16px}nav a.on span{background:var(--soft)}
.toast{position:fixed;left:16px;right:16px;bottom:96px;background:var(--tx);color:var(--bg);padding:14px;border-radius:14px;text-align:center;z-index:9}
.back{display:inline-block;margin-bottom:6px;color:var(--pr);font-weight:600;text-decoration:none}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;min-height:46px;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:15px}.tabs .on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
img.pv{width:100%;border-radius:12px;border:1px solid var(--ln)}
</style></head><body><div id="app"></div>

function line(ds,ser){const W=320,H=150,p=28,all=ser.flatMap(s=>s.v);let mn=Math.min(...all),mx=Math.max(...all);if(mn==mx){mn--;mx++}
const X=i=>p+(ds.length<2?0:i*(W-2*p)/(ds.length-1)),Y=v=>H-24-(v-mn)*(H-50)/(mx-mn);
return`<svg viewBox="0 0 ${W} ${H}" class="ch">`+ser.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="3" points="${s.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+s.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.c}"/><text x="${X(i)}" y="${Y(v)-8}" font-size="10" text-anchor="middle" fill="currentColor">${v}</text>`).join('')).join('')+ds.map((d,i)=>`<text x="${X(i)}" y="${H-6}" font-size="9" text-anchor="middle" fill="currentColor">${d.slice(5)}</text>`).join('')+'</svg>'}

function card(){const c=document.createElement('canvas');c.width=800;c.height=520;const x=c.getContext('2d'),t=today().split('-').reverse().join('-');x.fillStyle='#fff';x.fillRect(0,0,800,520);x.fillStyle='#0f766e';x.fillRect(0,0,800,80);x.fillStyle='#fff';x.font='bold 36px Arial';x.fillText('KARTU MCU SIGAP SEHAT',30,52);x.fillStyle='#000';x.font='bold 40px Arial';[['ID',U().uid],['Tanggal',t],['Tensi','128/82 mmHg'],['BB','61 kg'],['TB','158 cm'],['Gula Darah','105 mg/dL']].forEach((r,i)=>x.fillText(r[0]+': '+r[1],40,150+i*62));return c.toDataURL('image/png')}
function parse(t){const f={wid:'',tgl:'',sis:'',dia:'',bb:'',tb:'',gds:''};let m;
if(m=t.match(/WRG\s*[-–]?\s*(\d{3})/i))f.wid='WRG-'+m[1];
if(m=t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(20\d\d)/))f.tgl=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
if(m=t.match(/(?:tensi|td|tekanan)[^\d]{0,12}(\d{2,3})\s*\/\s*(\d{2,3})/i)){if(m[1]>=70&&m[1]<=260&&m[2]>=40&&m[2]<=150){f.sis=m[1];f.dia=m[2]}}
if(m=t.match(/(?:BB|berat)[^\d]{0,12}(\d{2,3}(?:[.,]\d)?)/i))f.bb=m[1].replace(',','.');
if(m=t.match(/(?:TB|tinggi)[^\d]{0,12}(\d{2,3})/i))f.tb=m[1];
if(m=t.match(/(?:gula|GDS)[^\d]{0,15}(\d{2,3})/i))f.gds=m[1];return f}
async function runOcr(img){S.scan={img,busy:1};go();
try{if(!window.Tesseract)throw 1;const r=await Promise.race([Tesseract.recognize(img,'eng'),new Promise((_,j)=>setTimeout(j,40000))]);S.scan={img,f:parse(r.data.text),mode:'ocr'}}
catch(e){S.scan={img,f:{wid:'',tgl:'',sis:'',dia:'',bb:'',tb:'',gds:''},mode:'fail'}}go()}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>runOcr(r.result);r.readAsDataURL(f)}
const sample=()=>runOcr(card());
const demoMode=()=>{S.scan={img:card(),f:{wid:U().uid,tgl:today(),sis:128,dia:82,bb:61,tb:158,gds:105},mode:'demo'};go()};
const fld=(l,id,v,ty='text',u='')=>`<label class="f" for="${id}">${l} ${u}</label><input id="${id}" type="${ty}" ${ty=='number'?'step="0.1" inputmode="decimal"':''} value="${esc(v)}">${v===''?'<span class="warn">Tidak terbaca. Isi sendiri ya.</span>':''}`;
function pScan(){const s=S.scan;let b=hd('Scan Kartu MCU');
if(!s||(!s.f&&!s.busy))return b+`<label class="btn">📷 Ambil Foto Kartu<input type="file" accept="image/*" capture="environment" hidden onchange="pick(this)"></label><label class="btn">🖼️ Pilih dari Galeri<input type="file" accept="image/*" hidden onchange="pick(this)"></label><p class="note">Data hanya tersimpan di perangkat ini. Hasil bacaan harus kamu cek dulu sebelum disimpan.</p>`;
if(s.busy)return b+`<img class="pv" src="${s.img}"><p class="note">⏳ Sedang membaca kartu… mohon tunggu.</p>`;
const f=s.f,msg={ocr:'Hasil bacaan kartu. Periksa dan perbaiki jika ada yang salah.',fail:'Kartu belum bisa dibaca otomatis di perangkat ini. Silakan isi sendiri datanya.',demo:'MODE DEMO: ini data contoh, bukan hasil bacaan foto.',manual:'Isi data dari kartu kamu.'}[s.mode];
return b+(s.img?`<img class="pv" src="${s.img}">`:'')+`<p class="note">${msg}</p>`+fld('Tanggal pemeriksaan','f_tgl',f.tgl,'date')+fld('Tekanan darah atas','f_sis',f.sis,'number','(mmHg)')+fld('Tekanan darah bawah','f_dia',f.dia,'number','(mmHg)')+fld('Berat badan','f_bb',f.bb,'number','(kg)')+fld('Tinggi badan','f_tb',f.tb,'number','(cm)')+fld('Gula darah (jika ada)','f_gds',f.gds,'number','(mg/dL)')+`<button class="btn" onclick="saveScan()">✅ Data Sudah Benar, Simpan</button><button class="btn g" onclick="S.scan=null;go()">Ulangi</button>`}
function saveScan(){const v=k=>$('#f_'+k).value.trim(),u=U(),wid=u.uid;

/* ===== KIRIM & IMPOR DATA (tanpa server) ===== */
async function sendData(){const u=U(),id=u.uid,o={app:'sigap-connect',v:1,nama:id,setuju:(u.cons||{})[id]||null,dibuat:new Date().toISOString(),rec:u.rec.filter(r=>r.wid===id),rep:u.rep.filter(r=>r.wid===id)};
if(!o.rec.length&&!o.rep.length)return toast('Belum ada data untuk dikirim');
const fn='sigap-'+id.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json',blob=new Blob([JSON.stringify(o)],{type:'application/json'});
try{const f=new File([blob],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Data SIGAP SEHAT'});return}}catch(e){if(e&&e.name==='AbortError')return}
try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();toast('File diunduh. Kirim ke petugas lewat WhatsApp.')}catch(e){toast('Gagal membuat file di perangkat ini')}}
const hsh=t=>{let h=5381;for(const c of t)h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36).slice(0,5)};
const cl=(t,n)=>String(t==null?'':t).replace(/[<>&"'`\\]/g,'').slice(0,n).trim();
const nz=(v,a,b)=>{if(v===''||v==null)return '';v=+v;return isFinite(v)&&v>=a&&v<=b?v:''};
const okd=t=>/^\d{4}-\d{2}-\d{2}$/.test(t);
async function impor(inp){const u=U();let nr=0,np=0,bad=0;
for(const f of inp.files){try{if(f.size>1e6)throw 0;const o=JSON.parse(await f.text());if(o.app!=='sigap-connect'||!o.setuju)throw 0;
const wid=cl(o.nama,30).replace(/[^A-Za-zÀ-ÿ0-9 .\-]/g,'').trim();if(wid.length<2)throw 0;const h=hsh(wid.toLowerCase());
(o.rec||[]).slice(0,500).forEach(r=>{if(!r||!okd(r.tgl))return;const id=cl(r.id,20).replace(/[^A-Za-z0-9]/g,'')+'-'+h;if(u.rec.some(x=>x.id===id))return;u.rec.push({id,wid,tgl:r.tgl,sis:nz(r.sis,50,300),dia:nz(r.dia,30,200),bb:nz(r.bb,2,300),tb:nz(r.tb,30,250),gds:nz(r.gds,20,800),src:'impor'});nr++});
(o.rep||[]).slice(0,500).forEach(r=>{if(!r||!okd(r.tgl))return;const no=cl(r.no,24).replace(/[^A-Za-z0-9-]/g,'')+'-'+h;if(u.rep.some(x=>x.no===no))return;u.rep.push({no,wid,jenis:JENIS.includes(r.jenis)?r.jenis:JENIS[JENIS.length-1],bagian:cl(r.bagian,40),sejak:cl(r.sejak,30),ket:cl(r.ket,300),tgl:r.tgl,status:STS[0],catatan:''});np++})}catch(e){bad++}}
st.set('sc_user',u);inp.value='';toast(nr+' pemeriksaan dan '+np+' laporan masuk'+(bad?'. '+bad+' file ditolak.':'.'));go()}
function delMe(){if(!S.del){S.del=1;go();return}const u=U(),id=u.uid;u.rec=u.rec.filter(r=>r.wid!==id);u.rep=u.rep.filter(r=>r.wid!==id);u.notif=u.notif.filter(n=>n.wid!==id);if(u.cons)delete u.cons[id];st.set('sc_user',u);S.del=0;logout();toast('Datamu sudah dihapus')}
